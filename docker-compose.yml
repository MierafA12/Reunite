version: '3.8'

services:

  # Laravel Backend
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: reunite_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - reunite_network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: reunite_frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - reunite_network

  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: reunite_db
    restart: always
    environment:
      POSTGRES_DB: reunite_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reunite_network

  # Optional: pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: reunite_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reunite.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - reunite_network

networks:
  reunite_network:

volumes:
  pgdata:
